<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" fill="none">
  <defs>
    <!-- Emerald Shield Gradient -->
    <linearGradient id="shieldGrad" x1="20" y1="20" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Metallic Shield Inner Bevel -->
    <linearGradient id="innerBevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Outer Security Ring Glow -->
    <radialGradient id="ringGlow" cx="70" cy="70" r="65" gradientUnits="userSpaceOnUse">
      <stop offset="60%" stop-color="#22C55E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Shimmer Beam -->
    <linearGradient id="scanBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="shieldClip">
      <path d="M42 35C42 30.5817 45.5817 27 50 27H90C94.4183 27 98 30.5817 98 35V69C98 85.5 82 98.5 70 105C58 98.5 42 85.5 42 69V35Z"/>
    </clipPath>

    <style>
      @keyframes rotateDial {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatShield {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3.5px); }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.08); }
      }
      @keyframes pingWave {
        0% { transform: scale(0.9); opacity: 0.8; }
        70%, 100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes laserScan {
        0% { transform: translateY(-30px); }
        50%, 100% { transform: translateY(90px); }
      }

      .dial-spin {
        transform-origin: 70px 70px;
        animation: rotateDial 22s linear infinite;
      }
      .shield-float {
        transform-origin: 70px 65px;
        animation: floatShield 4s ease-in-out infinite;
      }
      .badge-beat {
        transform-origin: 96px 94px;
        animation: badgePulse 2.8s ease-in-out infinite;
      }
      .ping-wave {
        transform-origin: 16px 16px;
        animation: pingWave 2.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      .scan-sweep {
        animation: laserScan 3.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="70" cy="70" r="62" fill="url(#ringGlow)"/>

  <!-- Rotating Metrology Dial -->
  <g class="dial-spin">
    <circle cx="70" cy="70" r="59" stroke="#22C55E" stroke-opacity="0.38" stroke-width="1.5" stroke-dasharray="5 3.5"/>
    <circle cx="70" cy="70" r="53" stroke="#22C55E" stroke-opacity="0.22" stroke-width="1"/>
    <circle cx="70" cy="11" r="2.5" fill="#4ADE80"/>
    <circle cx="129" cy="70" r="2.5" fill="#4ADE80"/>
    <circle cx="70" cy="129" r="2.5" fill="#4ADE80"/>
    <circle cx="11" cy="70" r="2.5" fill="#4ADE80"/>
    <circle cx="28" cy="28" r="1.5" fill="#22C55E" fill-opacity="0.7"/>
    <circle cx="112" cy="28" r="1.5" fill="#22C55E" fill-opacity="0.7"/>
    <circle cx="112" cy="112" r="1.5" fill="#22C55E" fill-opacity="0.7"/>
    <circle cx="28" cy="112" r="1.5" fill="#22C55E" fill-opacity="0.7"/>
  </g>

  <!-- Floating Shield -->
  <g class="shield-float">
    <path d="M42 37C42 31.5817 45.5817 28 50 28H90C94.4183 28 98 31.5817 98 36V70C98 86.5 82 99.5 70 106C58 99.5 42 86.5 42 70V37Z"
          fill="#080F0A" fill-opacity="0.75"/>
    <path d="M42 35C42 30.5817 45.5817 27 50 27H90C94.4183 27 98 30.5817 98 35V69C98 85.5 82 98.5 70 105C58 98.5 42 85.5 42 69V35Z"
          fill="url(#shieldGrad)"/>
    <path d="M42 35C42 30.5817 45.5817 27 50 27H90C94.4183 27 98 30.5817 98 35V69C98 85.5 82 98.5 70 105C58 98.5 42 85.5 42 69V35Z"
          fill="url(#innerBevel)"/>
    <g clip-path="url(#shieldClip)">
      <rect x="35" y="20" width="70" height="18" fill="url(#scanBeam)" class="scan-sweep"/>
    </g>
    <path d="M42 35C42 30.5817 45.5817 27 50 27H90C94.4183 27 98 30.5817 98 35V69C98 85.5 82 98.5 70 105C58 98.5 42 85.5 42 69V35Z"
          stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
    <g transform="translate(68, 59)">
      <path d="M11 -7.5 A13.5 13.5 0 1 0 13 2.5 H2" 
            fill="none" 
            stroke="#0F1711" 
            stroke-width="6.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Pulsing Verified Check Badge -->
  <g class="badge-beat" transform="translate(80, 78)">
    <circle cx="16" cy="16" r="15" fill="none" stroke="#4ADE80" stroke-width="2" class="ping-wave"/>
    <circle cx="16" cy="16" r="16.5" fill="#0A120D"/>
    <circle cx="16" cy="16" r="15" fill="#22C55E"/>
    <path d="M9.2 16.2L14 21L23 11.8" 
          stroke="#FFFFFF" 
          stroke-width="3.4" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
</svg>
